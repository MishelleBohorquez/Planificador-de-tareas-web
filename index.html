<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="imagenes/iconBlanco.png">
    <link rel="stylesheet" href="css/style.css">
    <title>Tashs</title>
</head>

<body>

    <!-- Barra vertical -->
    <div class="d-flex align-items-start">
        <div class="d-flex flex-column me-4 p-3 min-vh-100" id="sidebar-menu" style="min-width: 200px;">
            <a class="navbar-brand d-flex align-items-center mb-3 text-decoration-none fw-bold fs-5" href="#">
                <img src="imagenes/iconBlanco.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top me-2">
                Tashs
            </a>

            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                <button class="nav-link active text-start" id="v-pills-home-tab" data-bs-toggle="pill"
                    data-bs-target="#v-pills-home" type="button" role="tab" aria-controls="v-pills-home" aria-selected="true">
                    <i class="bi bi-calendar me-2"></i> Hoy
                </button>
                <button class="nav-link text-start" id="v-pills-profile-tab" data-bs-toggle="pill"
                    data-bs-target="#v-pills-profile" type="button" role="tab" aria-controls="v-pills-profile" aria-selected="false">
                    <i class="bi bi-list-check me-2"></i> Tareas
                </button>
                <button class="nav-link text-start" id="v-pills-messages-tab" data-bs-toggle="pill"
                    data-bs-target="#v-pills-messages" type="button" role="tab" aria-controls="v-pills-messages" aria-selected="false">
                    <i class="bi bi-calendar4-week me-2"></i> Calendario
                </button>
                <button class="nav-link text-start" id="v-pills-settings-tab" data-bs-toggle="pill"
                    data-bs-target="#v-pills-settings" type="button" role="tab" aria-controls="v-pills-settings" aria-selected="false">
                    <i class="bi bi-kanban me-2"></i> Proyectos
                </button>
            </div>
        </div>

        <!-- Barra vertical -->
        <div class="tab-content flex-grow-1 p-3" id="v-pills-tabContent">

            <!-- Hoy - Contenido -->
            <div class="tab-pane fade show active" id="v-pills-home" role="tabpanel" aria-labelledby="v-pills-home-tab" tabindex="0">
                <h3>Hola, Mishelle</h3>
                <p>Bienvenida a la sección principal.</p>
                <h5 class="mt-4">Mis tareas</h5>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <ul class="nav nav-pills" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill"
                                data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true">
                                Todas
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill"
                                data-bs-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile" aria-selected="false">
                                Pendientes
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="pills-contact-tab" data-bs-toggle="pill"
                                data-bs-target="#pills-contact" type="button" role="tab" aria-controls="pills-contact" aria-selected="false">
                                En progreso
                            </button>
                        </li>
                    </ul>

                    <!-- Filtro de prioridad -->
                    <div style="width: 160px;">
                        <select class="form-select form-select-sm" aria-label="Filtro de prioridad">
                            <option selected>Prioridad</option>
                            <option value="1">Alta</option>
                            <option value="2">Media</option>
                            <option value="3">Baja</option>
                        </select>
                    </div>
                </div>

                <!-- Hoy - Barra horizontal -->
                <div class="tab-content" id="pills-tabContent">
                    
                    <!-- Barra horizontal - Todas -->
                    <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab" tabindex="0">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="exampleRadios1" checked>
                            <label class="form-check-label" for="exampleRadios1">
                                Tarea de prueba 1
                            </label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="exampleRadios2">
                            <label class="form-check-label" for="exampleRadios2">
                                Tarea de prueba 2
                            </label>
                        </div>
                    </div>

                    <!-- Barra horizontal - Pendientes -->
                    <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab" tabindex="0">
                        <p>Aquí se muestran solo las tareas pendientes.</p>
                    </div>

                    <!-- Barra horizontal - En progreso -->
                    <div class="tab-pane fade" id="pills-contact" role="tabpanel" aria-labelledby="pills-contact-tab" tabindex="0">
                        <p>Aquí se muestran solo las tareas en progreso.</p>
                    </div>
                </div>

            </div>


            <!-- Tareas - Contenido -->
            <div class="tab-pane fade" id="v-pills-profile" role="tabpanel" aria-labelledby="v-pills-profile-tab" tabindex="0">
                <h3>Perfil / Tareas</h3>
                <p>Información de tareas.</p>
            </div>

            <!-- Calendario - Contenido -->
            <div class="tab-pane fade" id="v-pills-messages" role="tabpanel" aria-labelledby="v-pills-messages-tab" tabindex="0">
                <h3>Calendario</h3>
                <div class="mb-3 style="max-width: 300px;>
                    <label for="fecha" class="form-label">Selecciona una fecha:</label>
                    <input type="date" class="form-control" id="fecha">
                </div>
            </div>

            <!-- Proyectos - Contenido -->
            <div class="tab-pane fade" id="v-pills-settings" role="tabpanel" aria-labelledby="v-pills-settings-tab" tabindex="0">
                <h3>Proyectos</h3>
                <p>Configuración y gestión de proyectos.</p>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
