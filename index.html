<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="imagenes/iconBlanco.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css" rel="stylesheet">
    <title>Tashs</title>
</head>

<body>

    <!-- Barra vertical - Nombres -->
    <div class="d-flex align-items-start">
        <div class="d-flex flex-column p-3 min-vh-100" id="sidebar-menu" style="min-width: 200px;">
            <a class="navbar-brand d-flex align-items-center mb-3 text-decoration-none fw-bold fs-5" href="#">
                <img src="imagenes/iconBlanco.png" alt="Logo" width="30" height="24"
                    class="d-inline-block align-text-top me-2">
                Tashs
            </a>

            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                <button class="nav-link active text-start" id="v-pills-home-tab" data-bs-toggle="pill"
                    data-bs-target="#v-pills-home" type="button" role="tab" aria-controls="v-pills-home"
                    aria-selected="true">
                    <i class="bi bi-grid-1x2 me-2"></i> Dashboard
                </button>
                <button class="nav-link text-start" id="v-pills-profile-tab" data-bs-toggle="pill"
                    data-bs-target="#v-pills-profile" type="button" role="tab" aria-controls="v-pills-profile"
                    aria-selected="false">
                    <i class="bi bi-journal-check me-2"></i> Tareas
                </button>
                <button class="nav-link text-start" id="v-pills-messages-tab" data-bs-toggle="pill"
                    data-bs-target="#v-pills-messages" type="button" role="tab" aria-controls="v-pills-messages"
                    aria-selected="false">
                    <i class="bi bi-calendar me-2"></i> Calendario
                </button>
                <button class="nav-link text-start" id="v-pills-settings-tab" data-bs-toggle="pill"
                    data-bs-target="#v-pills-settings" type="button" role="tab" aria-controls="v-pills-settings"
                    aria-selected="false">
                    <i class="bi bi-person me-2"></i>Perfil
                </button>
            </div>
        </div>

        <!-- Barra vertical - Contenido -->
        <div class="tab-content flex-grow-1 p-3 min-vh-100" id="v-pills-tabContent">

            <!-- Hoy - Contenido -->
            <div class="tab-pane fade show active" id="v-pills-home" role="tabpanel" aria-labelledby="v-pills-home-tab"
                tabindex="0">
                <h1 id="titulosSubtitulos">Hola, Mishelle</h1>
                <p id="datoVer">Bienvenida a la sección principal.</p>

                <div class="container-fluid">
                    <div class="row">

                        <!-- Sección de Tareas -->
                        <div class="col-lg-8">
                            <h4 id="titulosSubtitulos">Tareas para Hoy</h4>

                            <div class="card mb-3" id="anadirTareaCard">
                                <div class="card-body">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="checkDefault">
                                        <label class="form-check-label" for="checkDefault">
                                            Default checkbox
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="card mb-3" id="anadirTareaCard">
                                <div class="card-body">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="checkChecked" checked>
                                        <label class="form-check-label" for="checkChecked">
                                            Checked checkbox
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Áreas de enfoque -->
                        <div class="col-lg-4">
                            <div class="card p-3" id="cardPrincipalResumen">

                                <h4 id="titulosSubtitulos">Áreas de enfoque</h4>

                                <div class="row g-3">

                                    <!-- Trabajo -->
                                    <div class="col-6">
                                        <div class="card h-100" id="cardResumenTrabajo">
                                            <div class="card-body">
                                                <h5 class="card-title">Trabajo</h5>
                                                <h6 class="card-subtitle text-body-secondary">
                                                    Tareas
                                                </h6>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Personal -->
                                    <div class="col-6">
                                        <div class="card h-100" id="cardResumenPersonal">
                                            <div class="card-body">
                                                <h5 class="card-title">Personal</h5>
                                                <h6 class="card-subtitle text-body-secondary">
                                                    Tareas
                                                </h6>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Salud -->
                                    <div class="col-12">
                                        <div class="card" id="cardResumenSalud">
                                            <div class="card-body">
                                                <h5 class="card-title">Salud</h5>
                                                <h6 class="card-subtitle text-body-secondary">
                                                    Tareas
                                                </h6>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                            </div>
                        </div>

                    </div>
                </div>

                <!-- Ingresar la tarea -->
                <h5>Agregar tarea</h5>
                <form>
                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <label for="nombreTarea" class="form-label">Nombre tarea</label>
                            <input type="text" class="form-control" id="nombreTarea"
                                placeholder="Ingrese el nombre de la tarea">
                        </div>

                        <div class="col-md-3">
                            <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
                            <input type="date" class="form-control" id="fechaEntrega">
                        </div>

                        <div class="col-md-4">
                            <label for="prioridad" class="form-label">Prioridad</label>
                            <select class="form-select" id="prioridad">
                                <option selected disabled>Seleccione...</option>
                                <option value="alta">Alta</option>
                                <option value="media">Media</option>
                                <option value="baja">Baja</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <button type="submit" class="btn btn-primary">
                                Añadir
                            </button>
                        </div>
                    </div>
                </form>
            </div>


            <!-- Tareas - Contenido -->
            <div class="tab-pane fade" id="v-pills-profile" role="tabpanel" aria-labelledby="v-pills-profile-tab"
                tabindex="0">
                <h3 id="titulosSubtitulos">Tus tareas</h3>
                <p id="datoVer">Gestiona y prioriza tu trabajo pendiente.</p>

                <!-- Pestañas de tareas -->
                <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="pills-todo-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-todo" type="button" role="tab" aria-controls="pills-todo"
                            aria-selected="true">Todo</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pills-pendiente-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-pendiente" type="button" role="tab" aria-controls="pills-pendiente"
                            aria-selected="false">Pendiente</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pills-hecho-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-hecho" type="button" role="tab" aria-controls="pills-hecho"
                            aria-selected="false">Hecho</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pills-prioridad-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-prioridad" type="button" role="tab" aria-controls="pills-prioridad"
                            aria-selected="false">Prioridad</button>
                    </li>
                </ul>
                <!-- Terminación de pestañas tareas -->

                <!-- Contenido de las pestañas tareas -->
                <div class="tab-content" id="pills-tabContent">

                    <!-- Todo inicio -->
                    <div class="tab-pane fade show active" id="pills-todo" role="tabpanel"
                        aria-labelledby="pills-home-tab" tabindex="0">
                        <div class="col-lg-8">

                            <div class="card mb-3" id="anadirTareaCard">
                                <div class="card-body">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="checkDefault">
                                        <label class="form-check-label" for="checkDefault">
                                            Default checkbox
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="card mb-3" id="anadirTareaCard">
                                <div class="card-body">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="checkChecked" checked>
                                        <label class="form-check-label" for="checkChecked">
                                            Checked checkbox
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Todo fin -->

                    <!-- Pendiente inicio -->
                    <div class="tab-pane fade" id="pills-pendiente" role="tabpanel" aria-labelledby="pills-profile-tab"
                        tabindex="0">
                        <div class="card mb-3" id="anadirTareaCard">
                            <div class="card-body">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="checkDefault">
                                    <label class="form-check-label" for="checkDefault">
                                        Default checkbox
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="card mb-3" id="anadirTareaCard">
                            <div class="card-body">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="checkChecked" checked>
                                    <label class="form-check-label" for="checkChecked">
                                        Checked checkbox
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Pendiente fin -->

                    <!-- Hecho inicio -->
                    <div class="tab-pane fade" id="pills-hecho" role="tabpanel" aria-labelledby="pills-contact-tab"
                        tabindex="0">
                        <div class="card mb-3" id="anadirTareaCard">
                            <div class="card-body">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="checkDefault">
                                    <label class="form-check-label" for="checkDefault">
                                        Default checkbox
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="card mb-3" id="anadirTareaCard">
                            <div class="card-body">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="checkChecked" checked>
                                    <label class="form-check-label" for="checkChecked">
                                        Checked checkbox
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Hecho fin -->

                    <!-- Prioridad inicio -->
                    <div class="tab-pane fade" id="pills-prioridad" role="tabpanel" aria-labelledby="pills-disabled-tab"
                        tabindex="0">
                        <div class="card mb-3" id="anadirTareaCard">
                            <div class="card-body">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="checkDefault">
                                    <label class="form-check-label" for="checkDefault">
                                        Default checkbox
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="card mb-3" id="anadirTareaCard">
                            <div class="card-body">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="checkChecked" checked>
                                    <label class="form-check-label" for="checkChecked">
                                        Checked checkbox
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Prioridad fin -->
                </div>
                <!-- Terminación de Contenido de las pestañas tareas -->
            </div>

            <!-- Tareas - Contenido - Fin -->

            <!-- Calendario - Contenido -->
            <div class="tab-pane fade" id="v-pills-messages" role="tabpanel" aria-labelledby="v-pills-messages-tab"
                tabindex="0">
                <h3 id="titulosSubtitulos">Calendario</h3>
                <div class="mb-3 style=" max-width: 300px;>
                    <label for="fecha" class="form-label" id="datoVer">Selecciona una fecha:</label>
                    <input type="date" class="form-control" id="fecha">
                <div id="v-pills-messages" class="tab-pane fade" role="tabpanel">
                </div>
            </div>

            <!-- Proyectos - Contenido -->
            <div class="tab-pane fade" id="v-pills-settings" role="tabpanel" aria-labelledby="v-pills-settings-tab"
                tabindex="0">
                <h3 id="titulosSubtitulos">Perfil</h3>
                <p id="datoVer">Perfil del usuario.</p>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
